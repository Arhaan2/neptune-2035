name: Phase 1 source verification
on:
  push:
    branches: [main, codex/neptune-phase-1]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: phase-1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Prepare virtual display and Mesa graphics
        run: sudo apt-get install -y --no-install-recommends --no-upgrade xvfb xauth libglx-mesa0 libgl1-mesa-dri libegl-mesa0 mesa-utils
      - name: Observe Firefox rendering environment
        timeout-minutes: 2
        run: env -u MOZ_HEADLESS xvfb-run -a -s '-screen 0 1920x1200x24' node scripts/phase-1/diagnose-firefox.mjs --headed --out=artifacts/phase-1-firefox
      - name: Retain bounded Firefox diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-firefox-${{ github.sha }}
          path: artifacts/phase-1-firefox
          if-no-files-found: error
          retention-days: 14
      # A diagnostic failure remains a failed job and cannot suppress acceptance.
      - if: ${{ !cancelled() }}
        run: env -u MOZ_HEADLESS xvfb-run -a -s '-screen 0 1920x1200x24' node scripts/phase-1/verify.mjs --out=artifacts/phase-1-ci
      - name: Retain source verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-1-verification-${{ github.sha }}
          path: artifacts/phase-1-ci
          if-no-files-found: error
          retention-days: 14
